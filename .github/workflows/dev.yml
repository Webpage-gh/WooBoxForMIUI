name: Dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Build with Gradle
      run: bash ./gradlew assembleRelease

    - name: Generate throwaway keystore
      id: throwaway
      run: |
        keytool -genkeypair -v \
          -keystore "$RUNNER_TEMP/ci-test.jks" \
          -storetype PKCS12 \
          -storepass citestpass \
          -keypass citestpass \
          -alias citestkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 365 \
          -dname "CN=WooBox CI Test, OU=CI, O=WooBox, L=NA, ST=NA, C=NA"
        echo "keystore=$RUNNER_TEMP/ci-test.jks" >> "$GITHUB_OUTPUT"

    - name: Sign Release APK
      if: success()
      id: sign
      env:
        KS_PASS: citestpass
      run: |
        set -euo pipefail
        which -a zipalign apksigner || true
        bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "Using build-tools: $bt"
        apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
        ver=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
        out="$RUNNER_TEMP/WooBoxForMIUI-$ver-ci-testkey.apk"
        "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
        "$bt/apksigner" sign \
          --ks "${{ steps.throwaway.outputs.keystore }}" \
          --ks-key-alias citestkey \
          --ks-pass env:KS_PASS \
          --key-pass env:KS_PASS \
          --out "$out" \
          "$RUNNER_TEMP/aligned.apk"
        "$bt/apksigner" verify --print-certs "$out"
        echo "apk=$out" >> "$GITHUB_OUTPUT"

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: WooBox_Release
        path: ${{ steps.sign.outputs.apk }}
